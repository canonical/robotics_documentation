name: turtlebot3-lyrical-teleop
base: core26
version: '0.1'
summary: Keyboard teleoperation for the TurtleBot3
description: Publish stamped velocity commands using the ROBOTIS TurtleBot3 keyboard node.
confinement: strict
grade: devel

parts:
  teleop:
    plugin: colcon
    source: https://github.com/ROBOTIS-GIT/turtlebot3.git
    source-commit: 0d4e59cf34da9c0661f80008bb0fa02636c713b2
    source-subdir: turtlebot3_teleop

apps:
  key:
    command: opt/ros/snap/lib/turtlebot3_teleop/teleop_keyboard
    extensions: [ros2-lyrical-ros-base]
    plugs: [network, network-bind]
    environment:
      TURTLEBOT3_MODEL: waffle_pi
