name: turtlebot3-lyrical
base: core26
version: '0.1'
summary: Bring up, drive and navigate a TurtleBot3 Waffle Pi
description: Run the ROBOTIS drivers, keyboard teleoperation, SLAM and Nav2 on ROS 2 Lyrical.
grade: devel
confinement: strict

plugs:
  opencr:
    interface: serial-port
  lidar:
    interface: serial-port

parts:
  robot:
    plugin: colcon
    source: src
    build-packages: [build-essential]
    stage-packages:
      - ros-lyrical-ros2launch
      - ros-lyrical-slam-toolbox
      - ros-lyrical-nav2-map-server
  commands:
    plugin: dump
    source: scripts
    organize:
      robot-app: bin/robot-app

apps:
  bringup:
    command: bin/robot-app bringup
    extensions: [ros2-lyrical]
    plugs: [network, network-bind, opencr, lidar]
    daemon: simple
    install-mode: disable
  key:
    command: bin/robot-app key
    extensions: [ros2-lyrical]
    plugs: [network, network-bind]
  mapping:
    command: bin/robot-app mapping
    extensions: [ros2-lyrical]
    plugs: [network, network-bind]
    daemon: simple
    install-mode: disable
  save-map:
    command: bin/robot-app save-map
    extensions: [ros2-lyrical]
    plugs: [network, network-bind]
  navigation:
    command: bin/robot-app navigation
    extensions: [ros2-lyrical]
    plugs: [network, network-bind]
    daemon: simple
    install-mode: disable
