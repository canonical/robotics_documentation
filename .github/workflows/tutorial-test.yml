# Periodically test a documentation tutorial with an AI agent and report
# findings as GitHub issues.
name: AI tutorial test

on:
  schedule:
    # Monthly, on the 1st at 06:00 UTC.
    - cron: '0 6 1 * *'
  workflow_dispatch:
  # TODO remove
  pull_request:
    branches: [main]

permissions: {}

jobs:
  tutorial-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: latest/stable

      - name: Test tutorial
        uses: canonical/robotics-actions-workflows/tutorial-test@feat/tutorial-test-with-ai
        with:
          tutorial-path: docs/tutorials/snaps-core/packaging-ros-application-as-snap.md
          skill-path: .github/tutorial-test/skills/packaging-ros-application-as-snap/SKILL.md
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
